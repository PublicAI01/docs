$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: PublicAI - Get Paid to Power Diverse Data for AI
  structure:
    - type: space
      key: space-1
      title: PublicAI - Get Paid to Power Diverse Data for AI
      path: publicai-documentation
      default: true
      content:
        directory: ./publicai-documentation
    # The token has its entry in the site footer; keeping it out of the docs
    # navigation leaves the two products PublicAI actually runs. Hidden, not
    # removed: every /token URL still resolves.
    - type: space
      key: space-2
      title: Token
      path: token
      hidden: true
      content:
        directory: ./token
